apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devops-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "devops-platform-backend"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "backend.devops-platform.svc.cluster.local:8000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: devops-platform
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
