name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devops_test_db
          POSTGRES_USER: devops_user
          POSTGRES_PASSWORD: devops_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U devops_user -d devops_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://devops_user:devops_password@localhost:5432/devops_test_db
        run: |
          python -m pytest

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/devops-platform:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/devops-platform:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-platform:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devops-platform:latest

  self-hosted-test:
    name: Test self-hosted runner
    runs-on: self-hosted

    steps:
      - name: Show environment
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "User: $(whoami)"
          echo "Hostname: $(hostname)"
          echo "Docker:"
          docker --version
          echo "Kubectl:"
          kubectl version --client
          echo "Minikube:"
          minikube version

deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres-service.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/backend.yaml

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend \
            -n devops-platform \
            --timeout=120s

      - name: Check deployment
        run: |
          kubectl get pods -n devops-platform
          kubectl get services -n devops-platform
